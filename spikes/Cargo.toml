[package]
name = "spike-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "spike1-windows-grants"
path = "src/bin/spike1_windows_grants.rs"

[[bin]]
name = "spike2-guardian-drain"
path = "src/bin/spike2_guardian_drain.rs"

# Not part of the robokura repository. This crate exists only to answer the
# spikes in ../SPIKES.md. It is deliberately a single throwaway crate rather
# than a workspace member, so that when a spike is closed its binary can be
# deleted without leaving anything behind in the real implementation.
#
# Pin the engine exactly. A minor bump re-runs the validation suite by policy,
# and a spike run against a different version measures that version, not the
# pinned dependency.

[dependencies]
# Spike 1 only. Spikes 2 and 3 need nothing but std and the host itself.
mxc-sdk = { version = "=1.0.0", default-features = false }
