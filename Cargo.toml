[workspace]
resolver = "3"
members = ["crates/robokura", "crates/robokura-core", "crates/robokura-acp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
agent-client-protocol = "2.2"
chrono = "0.4"
gpui-kit = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# The GPUI dependency tree is large. Dependencies are optimized and stripped of
# debug info so incremental builds stay quick; our own code keeps debug info.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
